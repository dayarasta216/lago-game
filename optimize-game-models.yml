name: Optimize game GLB models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install gltfpack
        run: |
          npm install --global gltfpack@1.2.0
          gltfpack -h >/dev/null

      - name: Create game model directory
        run: |
          mkdir -p assets/model/game

      - name: Optimize Lago
        run: |
          gltfpack \
            -i assets/model/roster/lago.glb \
            -o assets/model/game/lago.glb \
            -si 0.18 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Narek
        run: |
          gltfpack \
            -i assets/model/roster/narek.glb \
            -o assets/model/game/narek.glb \
            -si 1.0 \
            -kn \
            -km \
            -ke

      - name: Optimize Sola
        run: |
          gltfpack \
            -i assets/model/roster/sola.glb \
            -o assets/model/game/sola.glb \
            -si 0.12 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Doc
        run: |
          gltfpack \
            -i assets/model/roster/doc.glb \
            -o assets/model/game/doc.glb \
            -si 0.08 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Marvin
        run: |
          gltfpack \
            -i assets/model/roster/marvin.glb \
            -o assets/model/game/marvin.glb \
            -si 0.18 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Farid
        run: |
          gltfpack \
            -i assets/model/roster/farid.glb \
            -o assets/model/game/farid.glb \
            -si 0.04 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Miki
        run: |
          gltfpack \
            -i assets/model/roster/miki.glb \
            -o assets/model/game/miki.glb \
            -si 0.12 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Oleg
        run: |
          gltfpack \
            -i assets/model/roster/oleg.glb \
            -o assets/model/game/oleg.glb \
            -si 0.08 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Bozz
        run: |
          gltfpack \
            -i assets/model/roster/bozz.glb \
            -o assets/model/game/bozz.glb \
            -si 0.18 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Taya
        run: |
          gltfpack \
            -i assets/model/roster/taya.glb \
            -o assets/model/game/taya.glb \
            -si 0.08 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Validate GLB headers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(
              Path("assets/model/game").glob("*.glb")
          )

          expected = {
              "lago.glb",
              "narek.glb",
              "sola.glb",
              "doc.glb",
              "marvin.glb",
              "farid.glb",
              "miki.glb",
              "oleg.glb",
              "bozz.glb",
              "taya.glb",
          }

          found = {p.name for p in files}

          if found != expected:
              raise SystemExit(
                  f"Wrong model set: {found}"
              )

          for path in files:
              with path.open("rb") as file:
                  magic = file.read(4)

              if magic != b"glTF":
                  raise SystemExit(
                      f"Invalid GLB: {path}"
                  )

              size_mb = (
                  path.stat().st_size /
                  1024 /
                  1024
              )

              print(
                  f"{path.name}: "
                  f"{size_mb:.2f} MB"
              )

          print("GLB validation: PASS")
          PY

      - name: Model size report
        run: |
          {
            echo "## Game GLB optimization"
            echo ""
            echo "| Character | Master | Game |"
            echo "|---|---:|---:|"

            for file in assets/model/game/*.glb
            do
              name="$(basename "$file")"

              master="$(
                stat -c%s \
                "assets/model/roster/$name"
              )"

              game="$(
                stat -c%s \
                "$file"
              )"

              master_mb="$(
                awk \
                "BEGIN {
                  printf \"%.2f\", $master/1048576
                }"
              )"

              game_mb="$(
                awk \
                "BEGIN {
                  printf \"%.2f\", $game/1048576
                }"
              )"

              echo \
                "| $name | ${master_mb} MB | ${game_mb} MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit optimized game models
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/model/game

          if git diff \
            --cached \
            --quiet
          then
            echo "No model changes."
            exit 0
          fi

          git commit \
            -m \
            "Add optimized game GLB models"

          git push
