name: Optimize Lago Game Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install gltfpack
        run: |
          npm install --global gltfpack@1.2.0
          command -v gltfpack
          npm list --global gltfpack --depth=0

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "assets/model/tanks/team-blue.glb"
            "assets/model/tanks/team-red.glb"
            "assets/model/roster/lago.glb"
            "assets/model/roster/narek.glb"
            "assets/model/roster/sola.glb"
            "assets/model/roster/doc.glb"
            "assets/model/roster/marvin.glb"
            "assets/model/roster/farid.glb"
            "assets/model/roster/miki.glb"
            "assets/model/roster/oleg.glb"
            "assets/model/roster/bozz.glb"
            "assets/model/roster/taya.glb"
          )

          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: missing $file"
              exit 1
            fi

            echo "FOUND: $file"
          done

          echo "SOURCE CHECK: PASS"

      - name: Create output directories
        run: |
          rm -rf assets/model/game
          mkdir -p assets/model/game/tanks
          mkdir -p assets/model/game/characters

      - name: Optimize Team Blue tank
        run: |
          gltfpack \
            -i assets/model/tanks/team-blue.glb \
            -o assets/model/game/tanks/team-blue.glb \
            -si 0.14 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Team Red tank
        run: |
          gltfpack \
            -i assets/model/tanks/team-red.glb \
            -o assets/model/game/tanks/team-red.glb \
            -si 0.16 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Lago
        run: |
          gltfpack \
            -i assets/model/roster/lago.glb \
            -o assets/model/game/characters/lago.glb \
            -si 0.16 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Copy lightweight Narek
        run: |
          cp \
            assets/model/roster/narek.glb \
            assets/model/game/characters/narek.glb

      - name: Optimize Sola
        run: |
          gltfpack \
            -i assets/model/roster/sola.glb \
            -o assets/model/game/characters/sola.glb \
            -si 0.12 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Doc
        run: |
          gltfpack \
            -i assets/model/roster/doc.glb \
            -o assets/model/game/characters/doc.glb \
            -si 0.08 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Marvin
        run: |
          gltfpack \
            -i assets/model/roster/marvin.glb \
            -o assets/model/game/characters/marvin.glb \
            -si 0.14 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Farid
        run: |
          gltfpack \
            -i assets/model/roster/farid.glb \
            -o assets/model/game/characters/farid.glb \
            -si 0.045 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Miki
        run: |
          gltfpack \
            -i assets/model/roster/miki.glb \
            -o assets/model/game/characters/miki.glb \
            -si 0.10 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Oleg
        run: |
          gltfpack \
            -i assets/model/roster/oleg.glb \
            -o assets/model/game/characters/oleg.glb \
            -si 0.08 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Bozz
        run: |
          gltfpack \
            -i assets/model/roster/bozz.glb \
            -o assets/model/game/characters/bozz.glb \
            -si 0.14 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Optimize Taya
        run: |
          gltfpack \
            -i assets/model/roster/taya.glb \
            -o assets/model/game/characters/taya.glb \
            -si 0.08 \
            -sp \
            -kn \
            -km \
            -ke

      - name: Validate optimized GLB files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import struct
          from pathlib import Path

          PAIRS = [
              ("team-blue", Path("assets/model/tanks/team-blue.glb"), Path("assets/model/game/tanks/team-blue.glb"), True),
              ("team-red", Path("assets/model/tanks/team-red.glb"), Path("assets/model/game/tanks/team-red.glb"), True),
              ("lago", Path("assets/model/roster/lago.glb"), Path("assets/model/game/characters/lago.glb"), True),
              ("narek", Path("assets/model/roster/narek.glb"), Path("assets/model/game/characters/narek.glb"), False),
              ("sola", Path("assets/model/roster/sola.glb"), Path("assets/model/game/characters/sola.glb"), True),
              ("doc", Path("assets/model/roster/doc.glb"), Path("assets/model/game/characters/doc.glb"), True),
              ("marvin", Path("assets/model/roster/marvin.glb"), Path("assets/model/game/characters/marvin.glb"), True),
              ("farid", Path("assets/model/roster/farid.glb"), Path("assets/model/game/characters/farid.glb"), True),
              ("miki", Path("assets/model/roster/miki.glb"), Path("assets/model/game/characters/miki.glb"), True),
              ("oleg", Path("assets/model/roster/oleg.glb"), Path("assets/model/game/characters/oleg.glb"), True),
              ("bozz", Path("assets/model/roster/bozz.glb"), Path("assets/model/game/characters/bozz.glb"), True),
              ("taya", Path("assets/model/roster/taya.glb"), Path("assets/model/game/characters/taya.glb"), True),
          ]

          def read_glb(path):
              data = path.read_bytes()

              if len(data) < 20:
                  raise RuntimeError(f"{path}: too small")

              magic, version, length = struct.unpack_from("<4sII", data, 0)

              if magic != b"glTF":
                  raise RuntimeError(f"{path}: invalid GLB magic")

              if version != 2:
                  raise RuntimeError(
                      f"{path}: unsupported GLB version {version}"
                  )

              if length != len(data):
                  raise RuntimeError(
                      f"{path}: GLB length mismatch"
                  )

              offset = 12

              while offset + 8 <= len(data):
                  chunk_length, chunk_type = struct.unpack_from(
                      "<II",
                      data,
                      offset
                  )

                  offset += 8

                  chunk = data[
                      offset:
                      offset + chunk_length
                  ]

                  offset += chunk_length

                  if chunk_type == 0x4E4F534A:
                      return json.loads(
                          chunk
                          .decode("utf-8")
                          .rstrip("\x00 ")
                      )

              raise RuntimeError(
                  f"{path}: JSON chunk missing"
              )

          def triangles(doc):
              accessors = doc.get(
                  "accessors",
                  []
              )

              total = 0

              for mesh in doc.get(
                  "meshes",
                  []
              ):
                  for primitive in mesh.get(
                      "primitives",
                      []
                  ):
                      if primitive.get(
                          "mode",
                          4
                      ) != 4:
                          continue

                      if "indices" in primitive:
                          total += (
                              accessors[
                                  primitive["indices"]
                              ]
                              .get(
                                  "count",
                                  0
                              )
                              // 3
                          )

                      else:
                          pos = (
                              primitive
                              .get(
                                  "attributes",
                                  {}
                              )
                              .get(
                                  "POSITION"
                              )
                          )

                          if pos is not None:
                              total += (
                                  accessors[pos]
                                  .get(
                                      "count",
                                      0
                                  )
                                  // 3
                              )

              return total

          print("")
          print(
              "=== LAGO MODEL OPTIMIZATION REPORT ==="
          )
          print("")

          print(
              f"{'MODEL':<16}"
              f"{'SOURCE MB':>12}"
              f"{'GAME MB':>12}"
              f"{'SRC TRI':>14}"
              f"{'GAME TRI':>14}"
              f"{'SIZE %':>10}"
          )

          print("-" * 78)

          for (
              name,
              source,
              output,
              must_shrink
          ) in PAIRS:

              if not output.exists():
                  raise RuntimeError(
                      f"Missing output: {output}"
                  )

              source_doc = read_glb(
                  source
              )

              output_doc = read_glb(
                  output
              )

              source_bytes = (
                  source.stat().st_size
              )

              output_bytes = (
                  output.stat().st_size
              )

              source_size = (
                  source_bytes /
                  1048576
              )

              output_size = (
                  output_bytes /
                  1048576
              )

              source_tri = triangles(
                  source_doc
              )

              output_tri = triangles(
                  output_doc
              )

              size_ratio = (
                  output_bytes /
                  source_bytes *
                  100
              )

              print(
                  f"{name:<16}"
                  f"{source_size:>12.2f}"
                  f"{output_size:>12.2f}"
                  f"{source_tri:>14,}"
                  f"{output_tri:>14,}"
                  f"{size_ratio:>9.1f}%"
              )

              if must_shrink:

                  if (
                      output_bytes >=
                      source_bytes
                  ):
                      raise RuntimeError(
                          f"{output}: optimized "
                          f"file is not smaller "
                          f"than source"
                      )

              else:

                  if (
                      output_bytes !=
                      source_bytes
                  ):
                      raise RuntimeError(
                          f"{output}: lightweight "
                          f"source must be copied "
                          f"unchanged"
                      )

          print("")
          print(
              "GLB VALIDATION: PASS"
          )
          PY

      - name: Show output files
        run: |
          echo "=== TANKS ==="
          ls -lh assets/model/game/tanks

          echo ""
          echo "=== CHARACTERS ==="
          ls -lh assets/model/game/characters

      - name: Commit optimized models
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/model/game

          if git diff \
            --cached \
            --quiet
          then
            echo "No model changes to commit."
            exit 0
          fi

          git commit \
            -m \
            "Add optimized game models"

          git push
