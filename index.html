<style id="lago-legacy-compat">

/*
 * =========================================================
 * LEGACY COMPATIBILITY ONLY
 * =========================================================
 *
 * Old UI no longer participates in page layout.
 *
 * Only temporary legacy panels used by migration
 * code remain styled here.
 *
 * No global .btn / .card / .buy / button rules.
 * =========================================================
 */


* {

  box-sizing:
    border-box;

  -webkit-tap-highlight-color:
    transparent;

}


html,
body {

  margin:
    0;

  min-height:
    100%;

  background:
    #160916;

  color:
    #fff;

}


body {

  overflow-x:
    hidden;

}


/*
 * Legacy application shell is retained only
 * as temporary DOM compatibility storage.
 */

body > .app {

  display:
    none !important;

}


/*
 * =========================================================
 * TEMPORARY LEGACY PANELS
 * =========================================================
 */

body > .panel {

  position:
    fixed;

  inset:
    0;

  z-index:
    6000;

  display:
    none;

  align-items:
    flex-end;

  background:
    rgba(
      0,
      0,
      0,
      .76
    );

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

}


body > .panel.show {

  display:
    flex;

}


body > .panel.modal-center {

  align-items:
    center;

  justify-content:
    center;

  padding:
    16px;

}


/*
 * =========================================================
 * TEMPORARY GAME OVER
 * =========================================================
 */

#gameOverPanel .tutorial {

  width:
    min(
      440px,
      94vw
    );

  padding:
    20px;

  text-align:
    center;

  border:
    2px solid
    #ccff00;

  border-radius:
    16px;

  color:
    #fff;

  background:
    #170919;

}


#gameOverPanel .big {

  font-size:
    72px;

}


#gameOverPanel #restartBtn {

  width:
    100%;

  min-height:
    48px;

  margin-top:
    12px;

  border:
    1px solid
    #ccff00;

  border-radius:
    10px;

  color:
    #160916;

  background:
    #ccff00;

  font-weight:
    1000;

  cursor:
    pointer;

}


/*
 * Temporary legacy toast used by the
 * compatibility runtime.
 */

#toast {

  position:
    fixed;

  left:
    50%;

  bottom:
    20px;

  z-index:
    7000;

  max-width:
    90%;

  padding:
    9px
    12px;

  opacity:
    0;

  pointer-events:
    none;

  transform:
    translateX(-50%)
    translateY(20px);

  border:
    1px solid
    rgba(
      204,
      255,
      0,
      .55
    );

  border-radius:
    9px;

  color:
    #fff;

  background:
    #000;

  font-family:
    monospace;

  font-size:
    11px;

  text-align:
    center;

  transition:
    opacity
    .18s ease,
    transform
    .18s ease;

}


#toast.on {

  opacity:
    1;

  transform:
    translateX(-50%)
    translateY(0);

}

</style>
</head>


<body>


<!--
  =========================================================
  TEMPORARY CHARACTER FALLBACK
  =========================================================

  lago-modern.js moves #snail into
  #modernSnailArea.

  GLB runtime hides this image when
  the 3D character loads successfully.
-->

<div
  class="app"
  aria-hidden="true"
>

  <img
    id="snail"
    class="snail"
    alt="LAGO"
    src="./lago-snail.png"
    draggable="false"
  >

</div>


<!-- ======================================================
     TEMPORARY GAME OVER
     ====================================================== -->

<div
  class="panel modal-center"
  id="gameOverPanel"
>

  <div
    class="tutorial"
  >

    <div
      class="big"
    >
      💀
    </div>


    <h2>
      GAME OVER
    </h2>


    <p>
      Лаго перестал существовать.
      Мем-Энергия достигла нуля.
      Это было тупо.
    </p>


    <button
      class="btn main"
      id="restartBtn"
      type="button"
    >
      🐌 ВОЗРОДИТЬ ЛАГО
    </button>

  </div>

</div>


<!-- ======================================================
     GLOBAL TOAST
     ====================================================== -->

<div
  class="toast"

></div>
