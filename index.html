<!-- Solana Web3: используется только для подключения кошелька и Memo-транзакции -->

<style id="lago-legacy-compat">

/*
 * =========================================================
 * LEGACY COMPATIBILITY ONLY
 * =========================================================
 *
 * Old UI no longer participates in page layout.
 *
 * Only temporary legacy panels used by migration
 * code remain styled here.
 *
 * No global .btn / .card / .buy / button rules.
 * =========================================================
 */

* {
  box-sizing:
    border-box;

  -webkit-tap-highlight-color:
    transparent;
}


html,
body {

  margin:
    0;

  min-height:
    100%;

  background:
    #160916;

  color:
    #fff;

}


body {

  overflow-x:
    hidden;

}


/*
 * Legacy application shell is retained only
 * as temporary DOM compatibility storage.
 */

body > .app {

  display:
    none !important;

}


/*
 * =========================================================
 * TEMPORARY LEGACY PANELS
 * =========================================================
 */

body > .panel {

  position:
    fixed;

  inset:
    0;

  z-index:
    6000;

  display:
    none;

  align-items:
    flex-end;

  background:
    rgba(
      0,
      0,
      0,
      .76
    );

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

}


body > .panel.show {

  display:
    flex;

}


body > .panel.modal-center {

  align-items:
    center;

  justify-content:
    center;

  padding:
    16px;

}


body > .panel > .sheet {

  width:
    100%;

  max-height:
    86dvh;

  overflow:
    auto;

  padding:
    16px
    14px
    calc(
      18px +
      env(safe-area-inset-bottom)
    );

  color:
    #fff;

  background:
    #1d0b20;

  border-top:
    2px solid
    rgba(
      255,
      57,
      173,
      .65
    );

  box-shadow:
    0
    -12px
    34px
    rgba(
      169,
      0,
      255,
      .28
    );

}


body > .panel .close {

  float:
    right;

  min-width:
    38px;

  min-height:
    34px;

  padding:
    6px
    10px;

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      .18
    );

  border-radius:
    9px;

  color:
    #fff;

  background:
    rgba(
      255,
      57,
      173,
      .16
    );

  cursor:
    pointer;

}


body > .panel h2 {

  margin:
    0
    0
    12px;

  color:
    #ccff00;

}


body > .panel .card {

  margin:
    8px
    0;

  padding:
    12px;

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      .10
    );

  border-radius:
    12px;

  color:
    #fff;

  background:
    rgba(
      255,
      255,
      255,
      .025
    );

}


body > .panel .desc {

  color:
    rgba(
      255,
      255,
      255,
      .62
    );

  font-family:
    monospace;

  font-size:
    11px;

  line-height:
    1.45;

}


body > .panel .buy {

  min-height:
    38px;

  padding:
    8px
    10px;

  border:
    1px solid
    rgba(
      204,
      255,
      0,
      .45
    );

  border-radius:
    9px;

  color:
    #160916;

  background:
    #ccff00;

  font-weight:
    900;

  cursor:
    pointer;

}


body > .panel .hint {

  color:
    rgba(
      255,
      255,
      255,
      .48
    );

  font-family:
    monospace;

  font-size:
    11px;

  line-height:
    1.45;

}




#gameOverPanel .tutorial {

  width:
    min(
      440px,
      94vw
    );

  padding:
    20px;

  text-align:
    center;

  border:
    2px solid
    #ccff00;

  border-radius:
    16px;

  color:
    #fff;

  background:
    #170919;

}


#gameOverPanel .big {

  font-size:
    72px;

}


#gameOverPanel #restartBtn {

  width:
    100%;

  min-height:
    48px;

  margin-top:
    12px;

  border:
    1px solid
    #ccff00;

  border-radius:
    10px;

  color:
    #160916;

  background:
    #ccff00;

  font-weight:
    1000;

  cursor:
    pointer;

}


/*
 * Temporary legacy toast used by the
 * compatibility runtime.
 */

#toast {

  position:
    fixed;

  left:
    50%;

  bottom:
    20px;

  z-index:
    7000;

  max-width:
    90%;

  padding:
    9px
    12px;

  opacity:
    0;

  pointer-events:
    none;

  transform:
    translateX(-50%)
    translateY(20px);

  border:
    1px solid
    rgba(
      204,
      255,
      0,
      .55
    );

  border-radius:
    9px;

  color:
    #fff;

  background:
    #000;

  font-family:
    monospace;

  font-size:
    11px;

  text-align:
    center;

  transition:
    opacity
    .18s ease,
    transform
    .18s ease;

}


#toast.on {

  opacity:
    1;

  transform:
    translateX(-50%)
    translateY(0);

}

</style>
</head>

<body>
<div
  class="app"
  aria-hidden="true"
>
  <img
    id="snail"
    class="snail"
    alt="LAGO"
    src="./lago-snail.png"
    draggable="false"
  >
</div>

<!-- Апгрейды -->
<div class="panel" id="upgradePanel"><div class="sheet">
  <button class="close" data-close="upgradePanel">✕</button>
 <h2>🤖 AUTO UPGRADE</h2>
  <div id="upgradeList"></div>
</div></div>


<!-- Game Over -->
<div class="panel modal-center" id="gameOverPanel">
  <div class="tutorial">
    <div class="big">💀</div>
    <h2>GAME OVER</h2>
    <p>Лаго перестал существовать. Мем-Энергия достигла нуля. Это было тупо.</p>
    <button class="btn main" id="restartBtn">🐌 ВОЗРОДИТЬ ЛАГО</button>
  </div>
</div>

<div class="toast" id="toast"></div>
